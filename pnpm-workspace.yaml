packages:
  - packages/*

# New releases must age for a day unless Foundation has reviewed the exact pin.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - 'postcss@8.5.28'
  - 'vitest@5.0.0'

catalog:
  '@types/node': 22.20.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vue/compiler-sfc': 3.5.42
  esbuild: 0.28.2
  oxlint: 1.81.0
  parse5: 8.0.1
  playwright: 1.63.0
  react: 19.3.0
  react-dom: 19.3.0
  svelte: 5.57.0
  tsx: 4.23.13
  typescript: 7.0.2
  vitest: 5.0.0
  vue: 3.5.42

allowBuilds:
  esbuild: true
