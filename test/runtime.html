<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTML Next browser runtime fixture</title>
  </head>
  <body>
    <template component="x-button" status="early" summary="A native button with a themed presentation.">
      <defs>
        <prop name="variant" type="outline | solid" default="outline">Visual treatment.</prop>
        <prop name="size" type="sm | md | lg" default="md">Control size.</prop>
        <prop name="disabled" type="boolean" default="false">Whether the button is disabled.</prop>
      </defs>
      <button data-x-button type="button" :data-variant="variant" :data-size="size" :disabled="disabled">
        <slot></slot>
      </button>
      <style>button[data-x-button] { box-sizing: border-box; }</style>
    </template>

    <template component="x-status" status="early" summary="A native output status.">
      <defs>
        <prop name="message" type="string" default="Waiting">Status text.</prop>
      </defs>
      <output $value="message"></output>
    </template>

    <main>
      <x-button
        id="primary"
        class="cta"
        size="lg"
        type="submit"
        aria-label="Save changes"
        data-trace="runtime"
      >Save <strong id="kept-child">now</strong></x-button>
      <x-button id="disabled" variant="solid" disabled></x-button>
      <x-status id="status" message="Ready"></x-status>
    </main>
  </body>
</html>
