<html7-component>
  <script type="application/html7-contract+json">
    {
      "version": 1,
      "name": "Button",
      "tag": "looma-button",
      "status": "early",
      "summary": "A native button with Looma presentation.",
      "nativeElement": "button",
      "props": {
        "variant": {
          "type": { "enum": ["outline", "solid", "destructive", "ghost"] },
          "default": "outline",
          "target": { "attribute": "data-lm-variant" },
          "description": "Visual treatment."
        },
        "size": {
          "type": { "enum": ["sm", "md", "lg"] },
          "default": "md",
          "target": { "attribute": "data-lm-size" },
          "description": "Control size."
        }
      }
    }
  </script>

  <template>
    <button data-looma :data-lm-variant="variant" :data-lm-size="size">
      <slot></slot>
    </button>
  </template>

  <style>
    button[data-looma] {
      all: revert;
      box-sizing: border-box;
      display: inline-flex;
    }
  </style>
</html7-component>
