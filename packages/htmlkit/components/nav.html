<template component="hk-nav-items">
  <defs>
    <prop name="items" type="list(object({ label: string, current: string, depth: number, href?: string, group?: string, open?: boolean, children?: list(object({ label: string, ... })), ... }))" required>Navigation items, each with its nested items.</prop>
  </defs>
  <ul><template $each="item, index of $items">
    <li $if="$item.group and $item.group != $items[$index - 1].group" data-group from:data-depth="$item.depth">{$item.group}</li>
    <li from:data-depth="$item.depth">
      <template $match><details $when="$item.children" from:open="$item.open">
        <summary><template $match><a $when="$item.href" from:href="$item.href" from:aria-current="$item.current">{$item.label}</a><span $else>{$item.label}</span></template></summary>
        <hk-nav-items from:items="$item.children"></hk-nav-items>
      </details>
      <a $else from:href="$item.href" from:aria-current="$item.current">{$item.label}</a></template>
    </li>
  </template></ul>
</template>
<!-- The first three levels of items render inline, each as <hk-nav-items> renders a level, so a tree up to
  three levels deep is one instance and the page carries its items once. Each deeper level is an <hk-nav-items>. -->
<template component="hk-nav">
  <defs>
    <prop name="items" type="list(object({ label: string, current: string, depth: number, href?: string, group?: string, open?: boolean, children?: list(object({ label: string, ... })), ... }))" required>Ordered page links: navigation() items, or navigationTree() nodes.</prop>
    <prop name="label" type="string" default="Navigation">Accessible navigation name.</prop>
  </defs>
  <nav from:aria-label="$label"><ul><template $each="a, i of $items">
    <li $if="$a.group and $a.group != $items[$i - 1].group" data-group from:data-depth="$a.depth">{$a.group}</li>
    <li from:data-depth="$a.depth">
      <template $match><details $when="$a.children" from:open="$a.open">
        <summary><template $match><a $when="$a.href" from:href="$a.href" from:aria-current="$a.current">{$a.label}</a><span $else>{$a.label}</span></template></summary>
        <ul><template $each="b, j of $a.children">
          <li $if="$b.group and $b.group != $a.children[$j - 1].group" data-group from:data-depth="$b.depth">{$b.group}</li>
          <li from:data-depth="$b.depth">
            <template $match><details $when="$b.children" from:open="$b.open">
              <summary><template $match><a $when="$b.href" from:href="$b.href" from:aria-current="$b.current">{$b.label}</a><span $else>{$b.label}</span></template></summary>
              <ul><template $each="c, k of $b.children">
                <li $if="$c.group and $c.group != $b.children[$k - 1].group" data-group from:data-depth="$c.depth">{$c.group}</li>
                <li from:data-depth="$c.depth">
                  <template $match><details $when="$c.children" from:open="$c.open">
                    <summary><template $match><a $when="$c.href" from:href="$c.href" from:aria-current="$c.current">{$c.label}</a><span $else>{$c.label}</span></template></summary>
                    <hk-nav-items from:items="$c.children"></hk-nav-items>
                  </details>
                  <a $else from:href="$c.href" from:aria-current="$c.current">{$c.label}</a></template>
                </li>
              </template></ul>
            </details>
            <a $else from:href="$b.href" from:aria-current="$b.current">{$b.label}</a></template>
          </li>
        </template></ul>
      </details>
      <a $else from:href="$a.href" from:aria-current="$a.current">{$a.label}</a></template>
    </li>
  </template></ul></nav>
</template>
