<template component="hk-nav">
  <defs>
    <prop name="items" type="list(object({ href: string, label: string, current: string, depth: number, pageName: string, group?: string }))" required>Ordered concrete route links.</prop>
    <prop name="label" type="string" default="Navigation">Accessible navigation name.</prop>
  </defs>
  <nav from:aria-label="$label">
    <ul><template $each="item, index of $items">
      <li $if="$item.group and $item.group != $items[$index - 1].group" data-group from:data-depth="$item.depth">{$item.group}</li>
      <li from:data-depth="$item.depth"><a from:href="$item.href" from:aria-current="$item.current">{$item.label}</a></li>
    </template></ul>
  </nav>
</template>
