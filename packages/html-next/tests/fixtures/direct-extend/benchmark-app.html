<template
  component="benchmark-app"
  controller="./controller.js"
  status="early"
  summary="The keyed js-framework-benchmark application implemented as an HTML Next component."
>
  <defs>
    <state name="ready" type="boolean" value="false"></state>
    <state name="rows" type="list(object({ id: number, label: string }))" value="[]"></state>
    <state name="selected" type="number" nullable></state>
  </defs>
  <div id="main">
    <div class="container" $if="ready">
      <div class="jumbotron">
        <div class="row">
          <div class="col-md-6">
            <h1>HTML Next keyed</h1>
          </div>
          <div class="col-md-6">
            <div class="row">
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="run">Create 1,000 rows</button>
              </div>
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="runlots">Create 10,000 rows</button>
              </div>
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="add">Append 1,000 rows</button>
              </div>
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="update">Update every 10th row</button>
              </div>
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="clear">Clear</button>
              </div>
              <div class="col-sm-6 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="swaprows">Swap Rows</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <table class="table table-hover table-striped test-data">
        <tbody id="tbody">
          <tr $each="row of rows" $key="row.id" from:data-id="row.id" class:danger="row.id = selected">
            <td class="col-md-1" $value="row.id"></td>
            <td class="col-md-4"><a data-action="select" $value="row.label"></a></td>
            <td class="col-md-1">
              <a data-action="remove"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a>
            </td>
            <td class="col-md-6"></td>
          </tr>
        </tbody>
      </table>
      <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
    </div>
  </div>
</template>
