<!-- Purely visual: no controller, no state. Props in, native <span> out. -->
<template component="ui-badge" status="early" summary="A small status label.">
  <defs>
    <prop name="label" type="string" default="">Text shown inside the badge.</prop>
    <prop name="tone" type="'neutral' | 'warning' | 'danger'" default="neutral">Visual emphasis.</prop>
  </defs>
  <span class="badge" :data-tone="tone" $value="label"></span>
  <style>
    .badge { border-radius: 999px; padding: 0.1rem 0.5rem; font-size: 0.8rem; border: 1px solid; }
    .badge[data-tone="neutral"] { border-color: #b9c2cf; color: #42506a; }
    .badge[data-tone="warning"] { border-color: #d9a23b; color: #8a5d00; }
    .badge[data-tone="danger"] { border-color: #cc4b4b; color: #a01e1e; }
  </style>
</template>
