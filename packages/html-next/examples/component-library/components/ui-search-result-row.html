<template component="ui-search-result-row" status="early" summary="A structured native search result button.">
  <defs>
    <prop name="disabled" type="boolean" default="false">Disabled state.</prop>
    <prop name="selected" type="boolean" default="false">Selected state.</prop>
  </defs>
  <button type="button" :disabled="disabled" :aria-selected="selected">
    <slot name="leading"></slot>
    <span class="content"><slot name="title"></slot><slot name="meta"></slot><slot name="excerpt"></slot></span>
    <slot name="trailing"></slot>
  </button>
  <style>
    :host { display: flex; align-items: center; gap: 0.5rem; }
    .content { display: grid; flex: 1; }
  </style>
</template>
