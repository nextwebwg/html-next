<template component="ui-form-field" status="early" summary="A semantic field grouping surface.">
  <defs>
    <prop name="disabled" type="boolean" default="false">Disabled state.</prop>
    <prop name="label" type="string" default="">Field label.</prop>
    <prop name="required" type="boolean" default="false">Required state.</prop>
  </defs>
  <fieldset :disabled="disabled"><legend $value="label"></legend><slot></slot></fieldset>
  <style>
    :host-state([required]) legend::after { content: " *"; }
  </style>
</template>
