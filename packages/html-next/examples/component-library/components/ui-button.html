<template component="ui-button" status="early" summary="A native button with library presentation.">
  <defs>
    <prop name="disabled" type="boolean" default="false">Disabled state.</prop>
    <prop name="size" type="sm | md | lg" default="md">Control size.</prop>
    <prop name="variant" type="outline | solid | destructive | ghost" default="outline">Visual treatment.</prop>
  </defs>
  <button type="button" :disabled="disabled"><slot></slot></button>
  <style>
    :host { border: 1px solid currentColor; }
    :host-state([size="sm"]) { padding: 0.25rem 0.5rem; }
    :host-state([variant="solid"]) { background: CanvasText; color: Canvas; }
  </style>
</template>
