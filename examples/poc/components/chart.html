<!-- x-chart: wraps a (trivial) drawing library through a $ref to a canvas. -->
<link rel="controller" href="./chart.js" />

<template component="x-chart">
  <defs>
    <state name="bars" :value="[3, 7, 2, 5, 8, 4]"></state>
  </defs>
  <figure>
    <canvas $ref="surface" width="260" height="90" role="img" aria-label="demo bar chart"></canvas>
  </figure>
</template>
