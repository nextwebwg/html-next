<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML Next — proof of concept</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; color: #14181f; }
      button { font: inherit; padding: 0.4rem 0.8rem; cursor: pointer; }
      figure { margin: 1rem 0; }
      [data-component] { outline: 1px dashed #d8dee7; padding: 0.5rem; margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <!-- Resolve only the ENTRY component. Everything below it (x-counter, x-chart)
         is discovered from the definitions themselves, like an ES-module graph. -->
    <link rel="component" href="./components/app.html" />

    <x-app title="HTML Next POC"></x-app>

    <!-- Components name requested URLs; only these application-owned conventional mappings
         authorize them. Removing either entry leaves that declarative baseline in place. -->
    <script type="importmap">
      {
        "imports": {
          "html-next-controller/x-counter": "./components/counter.js",
          "html-next-controller/x-chart": "./components/chart.js"
        },
        "integrity": {
          "./components/counter.js": "sha384-JQF49jq2SyPmL5AL6gjhEiYcUiyixYJG+6eD0yV0ZJ1dGQWmwaiOEwedbs87yEpp",
          "./components/chart.js": "sha384-h97yek1GYuPpkiFR4SbvQDVwiUZkpdL3fouhE5VdNg+orrMmeK3mSTSsNTKh2ja5",
          "./poc.js": "sha384-8v9HxTgO33z7AMIYI/17UJ2buOFvmi69TLWWBUbGzRVOrCvLzeSW1KDaw+pncOiq"
        }
      }
    </script>

    <!-- The runtime: one ES module. -->
    <script
      type="module"
      src="./poc.js"
      integrity="sha384-8v9HxTgO33z7AMIYI/17UJ2buOFvmi69TLWWBUbGzRVOrCvLzeSW1KDaw+pncOiq"
    ></script>
  </body>
</html>
