name: DCO

# Every commit in a pull request must carry a Signed-off-by trailer, which makes the contribution
# under the group's terms: https://github.com/nextwebwg/.github/blob/main/CONTRIBUTING.md
# Reads the commits through the API; never checks out or runs code from the pull request.
# ponytail: checks the trailer is present, not that it names the author; tighten if that matters.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check every commit is signed off
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          unsigned=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate --jq '.[]
            | select(.author.type != "Bot")
            | select(.commit.message | test("(^|\n)Signed-off-by: ") | not)
            | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$unsigned" ]; then
            echo "These commits are not signed off:"
            echo "$unsigned"
            echo "Sign them off with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
