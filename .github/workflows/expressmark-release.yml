name: Release expressmark

# Bootstrap the npm name manually, then configure this exact workflow and the
# expressmark-release environment as its trusted publisher. No npm token is used.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact expressmark version committed on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: expressmark-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: expressmark-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@11.6.2 corepack@0.34.0
      - run: corepack enable
      - name: Check package identity and requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/expressmark/package.json', 'utf8'));
          if (pkg.name !== 'expressmark' || pkg.version !== process.env.RELEASE_VERSION || pkg.private) {
            throw new Error('Requested version must match the public expressmark package on main');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter expressmark verify
      - run: pnpm --filter expressmark pack --pack-destination .release
      - name: Publish the verified package with provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm publish ".release/expressmark-$RELEASE_VERSION.tgz" --provenance --access public --tag latest
