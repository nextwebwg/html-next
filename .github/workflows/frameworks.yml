name: Framework rendering

# A full paired comparison runs far longer than the 15-minute CI budget, so it runs nightly against
# the previous day's main instead of on each pull request.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare against (default is main as of 24 hours earlier)
        required: false

permissions:
  contents: read

concurrency:
  group: frameworks
  cancel-in-progress: false

jobs:
  changes:
    name: Detect runtime and compiler changes
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff.outputs.base }}
      runtime: ${{ steps.diff.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          REQUESTED_BASE: ${{ inputs.base }}
        run: |
          base="${REQUESTED_BASE:-$(git rev-list -1 --before="24 hours ago" HEAD)}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- packages/html-next/src packages/html-next-unplugin/src; then
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

  # Not yet a release gate: the paired rendering comparison's noise on hosted runners is unknown.
  frameworks:
    name: Framework rendering against the previous day
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # Up to three sweeps of four entries (Vite-compiled and live, candidate and base; an estimated 18
    # minutes each on an M4 Pro, twice the measured 9-minute two-entry sweep) plus a cold setup, at up
    # to 2.5x on hosted runners; tighten this from the first runs' per-sweep timing.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nextwebwg/html-next exec playwright install --with-deps chromium
      # The pinned Puppeteer runner keeps Chrome's sandbox, which needs unprivileged user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: benchmark-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/html-next/.benchmark/js-framework-benchmark
          # The script holds the fork pin and the control lockfile hashes.
          key: js-framework-benchmark-${{ runner.os }}-${{ hashFiles('packages/html-next/scripts/framework-benchmark.ts') }}
      - run: pnpm setup:frameworks
      # Saved before the gate: the combined action only saves after a successful job.
      - if: steps.benchmark-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/html-next/.benchmark/js-framework-benchmark
          key: ${{ steps.benchmark-cache.outputs.cache-primary-key }}
      - name: Compare the Vite-compiled and live entries on the nine keyed workloads
        env:
          PERFORMANCE_BASE: ${{ needs.changes.outputs.base }}
        run: pnpm verify:frameworks --base="$PERFORMANCE_BASE"
