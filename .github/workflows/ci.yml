name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Selection gets one minute; Required gets three to validate and publish the receipt.
# Routine checks target five minutes including setup; no automatic job can run past fifteen.
jobs:
  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      node: ${{ steps.plan.outputs.node }}
      browser: ${{ steps.plan.outputs.browser }}
      packages: ${{ steps.plan.outputs.packages }}
      has_node: ${{ steps.plan.outputs.has_node }}
      has_browser: ${{ steps.plan.outputs.has_browser }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      playwright: ${{ steps.plan.outputs.playwright }}
      generated: ${{ steps.plan.outputs.generated }}
      browser_reused: ${{ steps.reuse.outputs.reused }}
      browser_image: ${{ steps.reuse.outputs.image }}
      browser_node: ${{ steps.reuse.outputs.node }}
      host_kernel: ${{ steps.reuse.outputs.kernel }}
      runner_image: ${{ steps.reuse.outputs.runner_image }}
      tested_commit: ${{ steps.reuse.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # Selection uses only Node builtins: no dependency install or browser-version job.
      - id: plan
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-plan.ts
      - id: reuse
        name: Find successful browser validation
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BROWSER_PLAN: ${{ steps.plan.outputs.browser }}
        run: node scripts/ci-reuse.ts

  repository:
    name: Repository contracts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm exec tsc -p tsconfig.json
      - run: pnpm exec vitest run tests/ci.test.ts tests/ci-reuse.test.ts
      - run: pnpm --filter @nextwebwg/html-next check:release
      - if: needs.changes.outputs.generated == 'true'
        run: pnpm check:generated

  verify:
    name: Test ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - env:
          CI_JOB: ${{ toJSON(matrix) }}
        run: node scripts/ci-run.ts

  browser:
    name: Browser ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.has_browser == 'true' && needs.changes.outputs.browser_reused != 'true'
    runs-on: ubuntu-latest
    # Immutable browser userspace includes all three engines and OS libraries.
    container:
      image: ${{ needs.changes.outputs.browser_image }}
      options: --user 1001 --ipc=host --init
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.changes.outputs.browser_node }}
          package-manager-cache: false
      - id: environment
        name: Check browser validation inputs
        env:
          CI_TESTED_COMMIT: ${{ needs.changes.outputs.tested_commit }}
          CI_BROWSER_NODE: ${{ needs.changes.outputs.browser_node }}
          CI_HOST_KERNEL: ${{ needs.changes.outputs.host_kernel }}
        run: node scripts/ci-reuse.ts check-environment
      - name: Reusable environment matches
        if: steps.environment.outputs.eligible == 'true'
        run: echo 'Pinned browser userspace, Node, tested commit and host kernel match.'
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - env:
          CI_JOB: ${{ toJSON(matrix) }}
        run: node scripts/ci-run.ts

  packages:
    name: Packed ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '{./packages/${{ matrix.package }}}...' build
      - env:
          HTMLNEXT_PACKAGE_TEST: ${{ matrix.package }}
        run: pnpm test:package

  runtimes:
    name: Deno and Bun runtime
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.packages), 'htmlkit')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@nextwebwg/htmlkit...' build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the affected application packages in a consumer
        run: |
          mkdir -p "$RUNNER_TEMP/packs" "$RUNNER_TEMP/consumer"
          (cd packages/html-next && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          (cd packages/htmlkit && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          cd "$RUNNER_TEMP/consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
          cp "$GITHUB_WORKSPACE/packages/htmlkit/scripts/runtime-smoke.mjs" .
      - working-directory: ${{ runner.temp }}/consumer
        # Node builds the application whose server entry Deno and Bun then run.
        run: node runtime-smoke.mjs && deno run -A runtime-smoke.mjs && bun runtime-smoke.mjs

  required:
    name: Required
    if: always()
    needs: [changes, repository, verify, browser, packages, runtimes]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Only empty selection or validated browser reuse may skip a matrix. Fail closed otherwise.
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          for (const name of ['changes', 'repository']) {
            if (results[name].result !== 'success') process.exit(1);
          }
          for (const [name, flag] of [['verify', 'has_node'], ['browser', 'has_browser'], ['packages', 'has_packages']]) {
            const reused = name === 'browser' && results.changes.outputs.browser_reused === 'true';
            const expected = results.changes.outputs[flag] === 'true' && !reused ? 'success' : 'skipped';
            if (results[name].result !== expected) process.exit(1);
          }
          const runtimes = JSON.parse(results.changes.outputs.packages).includes('htmlkit') ? 'success' : 'skipped';
          if (results.runtimes.result !== runtimes) process.exit(1);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: receipt
        if: needs.changes.outputs.has_browser == 'true' && needs.changes.outputs.browser_reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BROWSER_PLAN: ${{ needs.changes.outputs.browser }}
          CI_RECEIPT_KERNEL: ${{ needs.changes.outputs.host_kernel }}
          CI_RECEIPT_RUNNER_IMAGE: ${{ needs.changes.outputs.runner_image }}
        run: |
          # Each job has its own filesystem; reconstruct the selector's exact receipt.
          GITHUB_OUTPUT='' node scripts/ci-reuse.ts write-receipt
          CI_RECEIPT="$RUNNER_TEMP/browser-validation.json" node scripts/ci-reuse.ts finalize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.receipt.outputs.receipt != ''
        with:
          name: browser-validation-v1
          path: ${{ steps.receipt.outputs.receipt }}
          if-no-files-found: error
          overwrite: true
