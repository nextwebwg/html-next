name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pr

  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      # The catalog entry, the version every package installs.
      - id: version
        run: |
          version=$(grep -A2 '^    playwright:$' pnpm-lock.yaml | sed -n 's/^      version: //p')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No Playwright catalog version in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  browser:
    name: Browser ${{ matrix.suite }}
    needs: playwright
    runs-on: ubuntu-latest
    # Playwright's image for the locked version carries the browsers and their OS libraries, so no
    # step waits on Ubuntu's apt mirrors (14 minutes for 115 MB on 2026-10-07) or Playwright's CDN.
    # pwuser shares the runner's uid 1001; Firefox refuses to run as root with a HOME it doesn't own.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host --init
    # Each check stays within the Threadlabs 15-minute budget. Parity specs launch their own
    # browsers, so each runner keeps one spec active and the parity suite is sharded instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Parity shards are balanced by measured spec time (vitest.targets.config.ts), about 8.5 minutes each.
        include:
          - { suite: runtime and consumers, command: pnpm test:browser && pnpm test:consumer }
          - { suite: framework parity 1/6, command: pnpm test:targets --shard=1/6 }
          - { suite: framework parity 2/6, command: pnpm test:targets --shard=2/6 }
          - { suite: framework parity 3/6, command: pnpm test:targets --shard=3/6 }
          - { suite: framework parity 4/6, command: pnpm test:targets --shard=4/6 }
          - { suite: framework parity 5/6, command: pnpm test:targets --shard=5/6 }
          - { suite: framework parity 6/6, command: pnpm test:targets --shard=6/6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  runtimes:
    name: Deno and Bun runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Deno 2.8 added the node:worker_threads markAsUncloneable that jsdom's undici imports.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # An installed consumer, as users run it; inside the workspace Bun applies tsconfig paths to source.
      - name: Install the packed packages in a consumer
        run: |
          mkdir -p "$RUNNER_TEMP/packs" "$RUNNER_TEMP/consumer"
          (cd packages/html-next && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          (cd packages/htmlkit && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          cd "$RUNNER_TEMP/consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
          cp "$GITHUB_WORKSPACE/packages/htmlkit/scripts/runtime-smoke.mjs" .
      - working-directory: ${{ runner.temp }}/consumer
        run: deno run -A runtime-smoke.mjs && bun runtime-smoke.mjs

  performance:
    name: Reactive performance against main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Compare the six representative reactive workloads
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm verify:performance --base="$PERFORMANCE_BASE"

  required:
    name: Required
    if: always()
    needs: [verify, browser, runtimes, performance]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success
      - run: test "${{ needs.browser.result }}" = success
      - run: test "${{ needs.runtimes.result }}" = success
      - run: test "${{ needs.performance.result }}" = success
